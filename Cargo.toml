[workspace]
resolver = "2"
members = [
    "crates/bmi-core",
    "crates/bmi-driver",
    "crates/bmi-driver-cli",
    "crates/bmi-py",
]
default-members = [
    "crates/bmi-core",
    "crates/bmi-driver",
    "crates/bmi-driver-cli",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
authors = ["Claude", "Josh Cu"]
repository = "https://github.com/JoshCu/bmi-driver"

[workspace.dependencies]
bmi-core = { path = "crates/bmi-core", version = "0.2.0", default-features = false }
bmi-driver = { path = "crates/bmi-driver", version = "0.2.0", default-features = false }
pyo3 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
