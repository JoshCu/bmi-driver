[workspace]
resolver = "2"
members = [
    "crates/bmi-core",
    "crates/bmi-driver",
    "crates/bmi-driver-cli",
]
# bmi-py is its own workspace, built by maturin. It must not be a member here: it enables
# pyo3/extension-module, and cargo unifies features across a workspace build, which would strip
# libpython out from under the CLI and fail to link it.
#
# bmi-wasm is also its own workspace: it only builds for wasm32-unknown-emscripten, and its
# [target.wasm32-unknown-emscripten] rustflags (an Emscripten linker command line) must not
# apply to native builds of the other crates.
exclude = ["crates/bmi-py", "crates/bmi-wasm"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
authors = ["Claude", "Josh Cu"]
repository = "https://github.com/JoshCu/bmi-driver"

[workspace.dependencies]
bmi-core = { path = "crates/bmi-core", version = "0.2.0", default-features = false }
bmi-driver = { path = "crates/bmi-driver", version = "0.2.0", default-features = false }
pyo3 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
