# Its own workspace on purpose -- see the `exclude` note in the repository root Cargo.toml.
[workspace]

[package]
name = "bmi-py"
description = "Python bindings for the bmi-driver BMI adapters."
version = "0.2.0"
edition = "2021"
license = "MIT"
authors = ["Claude", "Josh Cu"]
repository = "https://github.com/JoshCu/bmi-driver"

[lib]
name = "_bmi_driver"
crate-type = ["cdylib", "rlib"]

[features]
default = ["fortran", "python-models", "driver"]
fortran = ["bmi-core/fortran", "bmi-driver?/fortran"]
# The BMI Python adapter -- lets a Python caller drive a Python BMI model through the same
# unified interface. Never enables pyo3/auto-initialize: the interpreter is already running.
python-models = ["bmi-core/python", "bmi-driver?/python"]
# Forcings reading and whole-config Simulation. Requires libnetcdf at build and run time.
driver = ["dep:bmi-driver"]
zarr = ["bmi-driver?/zarr"]

[dependencies]
bmi-core = { path = "../bmi-core", version = "0.2.0", default-features = false }
bmi-driver = { path = "../bmi-driver", version = "0.2.0", default-features = false, features = ["gpkg"], optional = true }
numpy = "0.22"
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py39"] }
